; PlatformIO build, used by CI. The Arduino IDE can still open
; DasaiMochi/DasaiMochi.ino directly -- both compile the same sources.

[platformio]
src_dir = DasaiMochi

[env:esp32c3]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
lib_deps      = olikraus/U8g2@^2.35.30
build_flags   = -DARDUINO_USB_CDC_ON_BOOT=1
